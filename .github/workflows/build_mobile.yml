name: build_mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for
        type: choice
        required: true
        default: android
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production
      run_on_eas:
        description: Run build on EAS instead of locally in CI
        type: boolean
        default: true
      submit:
        description: Auto-submit production build
        type: boolean
        default: false
      output_eas_build_to_logs:
        description: Output EAS build logs
        type: boolean
        default: false
      inspect_eas_build_id:
        description: Retrieve diagnostics for an existing EAS build instead of building
        type: string
        required: false

jobs:
  diagnostics:
    if: ${{ inputs.inspect_eas_build_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve EAS build diagnostics
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: ${{ inputs.inspect_eas_build_id }}
        run: node .github/scripts/eas-build-diagnostics.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: eas-build-diagnostics
          path: eas-build-diagnostics
          retention-days: 7
  mobile:
    if: ${{ inputs.inspect_eas_build_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'all' && fromJSON('["ios", "android"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ !inputs.run_on_eas && matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Mobile App with EAS
        uses: ./.github/actions/build_mobile_eas
        with:
          local: ${{ !inputs.run_on_eas }}
          platform: ${{ matrix.platform }}
          profile: ${{ inputs.profile }}
          submit: ${{ inputs.submit }}
          output_logs: ${{ inputs.output_eas_build_to_logs }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

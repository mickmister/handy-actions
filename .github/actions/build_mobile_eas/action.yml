name: Build Mobile App with EAS
description: Build the Expo app with EAS.

inputs:
  expo-token:
    description: Expo token
    required: true
  platform:
    description: Platform to build for (all/android/ios)
    required: true
  profile:
    description: EAS build profile (validation/development/preview/production)
    required: true
  submit:
    description: Auto-submit production builds
    required: false
    default: 'false'
  local:
    description: Build locally in CI
    required: false
    default: 'false'
  output_logs:
    description: Output EAS build logs
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.5.1

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install modules
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      shell: bash
      run: pnpm run typecheck

    - name: Unit tests
      shell: bash
      run: pnpm test

    - name: Install Java for local Android builds
      if: ${{ inputs.local == 'true' && inputs.platform == 'android' }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Configure Android SDK for local builds
      if: ${{ inputs.local == 'true' && inputs.platform == 'android' }}
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: 'false'

    - name: Select Xcode for Expo SDK 57
      if: ${{ inputs.local == 'true' && inputs.platform == 'ios' }}
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer && xcodebuild -version

    - name: Build locally
      if: ${{ inputs.local == 'true' }}
      shell: bash
      env:
        EXPO_GITHUB_ACTIONS_RUN: true
        EXPO_APP_PROFILE: ${{ inputs.profile == 'validation' && 'preview' || inputs.profile }}
        EXPO_TOKEN: ${{ inputs.expo-token }}
        EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
        EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local
      run: pnpm exec eas build --non-interactive --wait --platform=${{ inputs.platform }} --profile=${{ inputs.profile }} --local

    - name: Upload failed local build logs
      if: ${{ failure() && inputs.local == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: local-build-logs-${{ inputs.platform }}
        path: ${{ runner.temp }}/eas-local/logs
        if-no-files-found: ignore
        retention-days: 7

    - name: Send build to EAS
      if: ${{ inputs.local != 'true' && (inputs.submit != 'true' || inputs.profile != 'production') }}
      shell: bash
      env:
        EXPO_APP_PROFILE: ${{ inputs.profile }}
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        if [[ "${{ inputs.output_logs }}" != "true" ]]; then
          exec >/dev/null 2>&1
        fi
        pnpm exec eas build --non-interactive --wait --platform=${{ inputs.platform }} --profile=${{ inputs.profile }}

    - name: Build and submit
      if: ${{ inputs.local != 'true' && inputs.submit == 'true' && inputs.profile == 'production' }}
      shell: bash
      env:
        EXPO_APP_PROFILE: ${{ inputs.profile }}
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        if [[ "${{ inputs.output_logs }}" != "true" ]]; then
          exec >/dev/null 2>&1
        fi
        pnpm exec eas build --non-interactive --wait --auto-submit --platform=${{ inputs.platform }} --profile=${{ inputs.profile }}
